[project]
name = "sports-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.157.0",
  "uvicorn==0.54.0",
  "sqlalchemy>=2.0,<2.1",
  "httpx>=0.27",
  "pydantic-ai-slim[openai]>=2.59.0,<3",
  "garminconnect>=0.3.16",
  "fitdecode>=0.11.0",
  "python-multipart>=0.0.32",
  "pandas>=2.2",
  "numpy>=2",
  "scipy>=1.13",
  "fit-tool==0.9.16",
  "argon2-cffi==23.1.0",
  "pillow>=13.0.0",
  "pillow-heif>=0.18",
  "pypdf>=6.21.4",
  "pypdfium2>=4.30",
  "pydantic-settings>=2.6,<3",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# FastAPI's Depends() in argument defaults is the idiom, not a bug.
ignore = ["B008"]
